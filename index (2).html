<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui, -apple-system, sans-serif;}
body{
    background: linear-gradient(160deg, #1b082b 0%, #481866 100%);

.container{max-width:600px;margin:0 auto;}
.page{display:none;}
.page.active{display:block;}

/* 密码页 */
.pass-card{

}
.btn:hover{opacity:0.9;}

/* 答题页面 */
.progress-wrap{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;}
.progress-bar{flex:1;height:8px;background:#381852;border-radius:99px;overflow:hidden;margin-right:12px;}
.progress-fill{height:100%;background:linear-gradient(90deg,#ff88cc,#c77dff);border-radius:99px;transition:0.3s;}
.title{text-align:center;font-size:28px;font-weight:bold;margin-bottom:16px;color:#ffe6f7;}
.subtitle{text-align:center;color:#e9cff0;margin-bottom:30px;font-size:16px;}
.question-card{
    background: #2c1044;
    border:1px solid #c77dff;
    border-radius:16px;
    padding:20px;
    margin-bottom:24px;
    font-size:17px;
    line-height:1.6;
}
.options{display:grid;gap:14px;}
.opt{
    background:#381852;
    border:1px solid #bb86fc;
    border-radius:14px;
    padding:16px;
    cursor:pointer;
    transition:0.2s;
}
.opt:hover{background:#421e60;}
.opt.selected{
    background:#502270;
    border-color:#ffb8dd;
}
.btns-row{display:flex;gap:12px;margin-top:28px;}
.btns-row .btn{flex:1;}

/* 结果页（最终优化：消除雷达图底部大空白） */
.result-card{
    background: #2c1044;
    border:1px solid #c77dff;
    border-radius:20px;
    padding:24px 20px 20px;
    text-align:center;
}
.result-title{font-size:34px;font-weight:bold;color:#ffe6f7;margin-bottom:8px;}
.result-sub{color:#e9cff0;font-size:18px;margin-bottom:12px;}

/* 雷达图终极修复：无底部空白、饱满居中 */
#radarBox{
    width:100%;
    max-width:460px;
    aspect-ratio:1/0.82;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
}
#radarBox canvas{
    width:100%!important;
    height:100%!important;
}

.dim-wrap{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:20px;}
.dim-card{

// 全局变量
let current = 0;
let answers = Array(10).fill(null);
let pwdOk = false;
const PASSWORD = "6666";

// 页面切换
function hideAll(){
    document.querySelectorAll(".page").forEach(el=>el.classList.remove("active"));
}
function showPage(id){
    hideAll();
    document.getElementById(id).classList.add("active");
}

//密码校验
function checkPwd(){
    const val = document.getElementById("pwdInput").value.trim();
    if(val === PASSWORD){
        pwdOk = true;
        showPage("pageStart");
    }else{
        document.getElementById("pwdErr").innerText = "密码错误，请重试";
    }
}

//渲染题目
function renderQuestion(){
    const q = questions[current];
    document.getElementById("qTitle").innerText = `第${current+1}题`;
    document.getElementById("qText").innerText = q.q;
    const wrap = document.getElementById("optWrap");
    wrap.innerHTML = "";
    q.opts.forEach((opt,idx)=>{
        const div = document.createElement("div");
        div.className = "opt" + (answers[current]===idx?" selected":"");
        div.innerText = opt.txt;
        div.onclick = ()=>{
            answers[current] = idx;
            renderQuestion();
        }
        wrap.appendChild(div);
    })
    document.getElementById("progFill").style.width = `${(current+1)/10*100}%`;
    document.getElementById("progText").innerText = `${current+1}/10`;
    document.getElementById("btnPrev").style.visibility = current===0 ? "hidden":"visible";
}

function goQuestion(idx){
    current = idx;
    showPage("pageQuiz");
    renderQuestion();
}
function prevQuestion(){
    if(current>0){
        current--;
        renderQuestion();
    }
}
function nextQuestion(){
    if(answers[current] === null){
        alert("请先选择一个选项");
        return;
    }
    if(current < 9){
        current++;
        renderQuestion();
    }else{
        calcResult();
    }
}

//计算总分+维度分
function calcResult(){
    let total = 0;
    let borderScore = 0;
    let filterScore = 0;
    let emotionScore = 0;
    for(let i=0;i<10;i++){
        const optIdx = answers[i];
        const s = questions[i].opts[optIdx].v;
        total += s;
        if(dimIndex.border.includes(i)) borderScore += s;
        if(dimIndex.filter.includes(i)) filterScore += s;
        if(dimIndex.emotion.includes(i)) emotionScore += s;
    }
    let lv;
    for(let item of levelText){
        if(total >= item.min && total <= item.max){
            lv = item;break;
        }
    }
    document.getElementById("resGrade").innerText = lv.title;
    document.getElementById("resScore").innerText = `总分：${total}分 ${lv.sub}`;
    document.getElementById("dim1").innerText = `${borderScore}/12`;
    document.getElementById("dim2").innerText = `${filterScore}/9`;
    document.getElementById("dim3").innerText = `${emotionScore}/9`;
    document.getElementById("resDesc").innerText = lv.desc;
    showPage("pageResult");
    drawRadar(borderScore,filterScore,emotionScore);
}

//【终极修复雷达图：无底部空白、比例完美、网格清晰、不重复叠加】
function drawRadar(b,f,e){
    const ctx = document.getElementById("radarChart").getContext("2d");
    if(window._radarInstance) window._radarInstance.destroy();

    window._radarInstance = new Chart(ctx,{
        type:"radar",
        data:{
            labels:["边界感","滤镜美化","情绪依附"],
            datasets:[{
                label:"你的分数",
                data:[b, f/9*12, e/9*12],
                backgroundColor:"rgba(255,184,221,0.25)",
                borderColor:"#ffb8dd",
                borderWidth:2,
                pointBackgroundColor:"#bb86fc",
                pointBorderColor:"#fff",
                pointBorderWidth:2,
                pointRadius:4
            }]
        },
        options:{
            responsive:true,
            maintainAspectRatio:true,
            plugins:{legend:{display:false}},
            scales:{
                r:{
                    min:0,max:12,
                    ticks:{display:false},
                    grid:{color:"rgba(255,255,255,0.18)",circular:false},
                    angleLines:{color:"rgba(255,255,255,0.18)"},
                    pointLabels:{
                        color:"#f3e6f9",
                        font:{size:14},
                        padding:12
                    }
                }
            },
            layout:{
                padding:{top:0,left:0,right:0,bottom:0}
            }
        }
    });
}

//重置测试
function restartTest(){
    current=0;
    answers = Array(10).fill(null);
    showPage("pageStart");
}
